stages: [build, deploy]

build-main:
  stage: build
  extends: [.build_remote_app_prod_legacy]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    PROJECT_KEY: "templateService"
    REMOTE_APP_PROD_BUILD_ENV: "production"

deploy-main:
  stage: deploy
  extends: [.deploy_remote_app_prod_legacy]
  needs: ["build-main"]
  tags: [fe-template-service]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
  variables:
    PROJECT_KEY: "templateService"
    FEATURE_FLAG_SYNC_ENVIRONMENT: "production"
    REMOTE_APP_PROD_DEPLOY_TARGET: "fe-template-service"
