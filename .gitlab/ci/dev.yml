stages: [build, deploy]

build-templateService-dev:
  stage: build
  extends: [.build_remote_app]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    PROJECT_KEY: "templateService"
    NPM_CONFIG_CACHE: ".npm"
    ENV_TAG: "dev"

deploy-templateService-dev:
  stage: deploy
  extends: [.deploy_remote_app]
  tags: [fe-dev]
  resource_group: deploy:templateService
  needs: ["build-templateService-dev"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  variables:
    PROJECT_KEY: "templateService"
    FEATURE_FLAG_SYNC_ENVIRONMENT: "develop"
